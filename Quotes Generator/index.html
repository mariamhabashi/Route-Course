<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote of the Day</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Quote of the Day</h1>
        <p class="instructions">Press the button below to receive a random quote!</p>       
        <button id="newQuoteBtn">New Quote</button>
        
        <div id="quoteDisplay" class="quote-container">
            <p id="quoteText" class="quote-text"></p>
            <p id="quoteAuthor" class="quote-author"></p>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
