<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmarker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Bookmarker</h1>
      </header>
      <div class="separator"></div>
      <main>
        <h2>
            <i class="fa-solid fa-bookmark"></i>
            <span>Bookmark your favorite sites</span>
            <i class="fa-solid fa-bookmark"></i>
        </h2>
        <div class="form-group">
          <label for="siteName"
            ><i class="fa-solid fa-book-bookmark me-2"></i> Site Name</label
          >
          <input
            type="text"
            id="siteName"
            class="form-control"
            placeholder="Bookmark Name"
            oninput="validateInput(this)"
          />
        </div>
        <div class="form-group">
          <label for="siteURL"
            ><i class="fa-solid fa-link me-2"></i> Site URL</label
          >
          <input
            type="text"
            id="siteURL"
            class="form-control"
            placeholder="Website URL"
            oninput="validateInput(this)"
          />
        </div>
        <button id="submitBtn" onclick="addBookmark()" class="btn-submit">
          Submit
        </button>
      </main>
      <div class="separator"></div>
      <table class="table">
        <thead>
          <tr>
            <th>Index</th>
            <th>Website Name</th>
            <th>Visit</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <!-- Modal (No changes here, it's fine) -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <div class="modal-header">
          <div class="circles">
            <span class="circle red"></span>
            <span class="circle yellow"></span>
            <span class="circle green"></span>
          </div>
          <button class="btn-close" onclick="closeModal()">X</button>
        </div>
        <div class="modal-content">
          <p>Site Name or Url is not valid, Please follow the rules below :</p>
          <ul>
            <li>
              <i class="fa-regular fa-circle-right"></i> Site name must contain
              at least 3 characters
            </li>
            <li>
              <i class="fa-regular fa-circle-right"></i> Site URL must be a
              valid one
            </li>
          </ul>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
